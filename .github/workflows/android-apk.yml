name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Create Android project
        run: |
          mkdir -p apk-build/www
          cp -R my-game/. apk-build/www/
          cd apk-build
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.remythestargem.islandadventure",
            "appName": "Island Adventure",
            "webDir": "www"
          }
          EOF
          CI=true npx cap add android
          # Enforce automatic landscape orientation in AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build debug APK
        run: cd apk-build/android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: island-adventure-debug-apk
          path: apk-build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
