name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download 3D track asset
        run: |
          mkdir -p my-game/assets/track
          curl -fL "https://drive.usercontent.google.com/download?id=1RRDa4SuIEMT3ej1yLatr6gN_6_XAapXJ&export=download&confirm=t" -o my-game/assets/track/track.glb
          ls -lh my-game/assets/track/track.glb

      - name: Optimize track for mobile (gltf-transform pipeline)
        run: |
          cd my-game/assets/track
          npx --yes @gltf-transform/cli@4.5.1 optimize track.glb track-mobile.glb \
            --simplify true \
            --simplify-ratio 0.15 \
            --simplify-error 0.0002 \
            --texture-compress webp \
            --texture-size 2048 \
            --compress quantize \
            --join false \
            --instance false \
            --palette false \
            --prune true
          mv track-mobile.glb track.glb
          ls -lh track.glb

      - name: Download and optimize Mercedes W206 car model
        run: |
          mkdir -p my-game/assets/car
          curl -fL "https://drive.usercontent.google.com/download?id=1_WO-O_L4q9kcNPTrk04h4aJNB6NudSJy&export=download&confirm=t" -o my-game/assets/car/mercedes-source.glb
          npx --yes @gltf-transform/cli@4.5.1 optimize my-game/assets/car/mercedes-source.glb my-game/assets/car/mercedes-w206.glb \
            --simplify true \
            --simplify-ratio 0.36 \
            --simplify-error 0.0002 \
            --texture-compress webp \
            --texture-size 1024 \
            --compress quantize \
            --join false \
            --instance false \
            --palette false \
            --prune true
          rm my-game/assets/car/mercedes-source.glb
          ls -lh my-game/assets/car/mercedes-w206.glb

      - name: Create Android project
        run: |
          mkdir -p apk-build/www
          cp -R my-game/. apk-build/www/
          cd apk-build
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.remythestargem.sparacing",
            "appName": "Spa Racing",
            "webDir": "www"
          }
          EOF
          CI=true npx cap add android
          # Enforce automatic landscape orientation in AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:hardwareAccelerated="true" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build debug APK
        run: cd apk-build/android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spa-racing-debug-apk
          path: apk-build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
