<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#182c2d">
  <title>Spa Racing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- Racing / Player HUD -->
    <div id="hud">
      <div class="hud-top">
        <div class="hud-box" id="perf-box" style="background: rgba(0,0,0,0.65); border: 1px solid rgba(255,255,255,0.2);">
          <span class="hud-label" style="color: #4ade80;">PERF</span>
          <span class="hud-value" id="fps-counter" style="font-size: 1.1rem; color: #4ade80;">-- FPS</span>
          <span id="frametime-counter" style="font-size: 0.75rem; color: #cbd5e1;">-- ms</span>
        </div>

        <div class="hud-box">
          <span class="hud-label">TIME</span>
          <span id="lap-time" class="hud-val">00:00.00</span>
        </div>
        <div class="hud-box">
          <span class="hud-label">MODE</span>
          <span id="mode-val" class="hud-val">IN CAR</span>
        </div>
        <div class="hud-box">
          <span class="hud-label">TRACK</span>
          <span class="hud-val">Spa-Francorchamps</span>
        </div>
      </div>

      <div class="speedometer-container" id="speedo-box">
        <div id="speedometer">0</div>
        <div class="speed-unit">KM/H</div>
        <div id="gear-indicator">N</div>
      </div>
    </div>

    <div id="look-hint" aria-hidden="true">DRAG TO LOOK</div>

    <!-- Toggle Car/Foot Button -->
    <button id="btn-toggle-vehicle" class="action-btn" type="button" aria-label="Exit or enter car">EXIT CAR</button>

    <!-- Mobile Touch Controls -->
    <div id="touch-controls" aria-label="Touch driving and movement controls">
      <!-- Analog steering; becomes camera-relative movement while on foot -->
      <div class="steer-cluster">
        <div id="steer-pad" class="steer-pad" role="application" aria-label="Drag to steer or move">
          <span class="steer-direction steer-up">▲</span>
          <span class="steer-direction steer-left">◀</span>
          <span class="steer-direction steer-right">▶</span>
          <span class="steer-direction steer-down">▼</span>
          <div id="steer-knob" class="steer-knob"></div>
        </div>
      </div>

      <!-- Brake/reverse and acceleration/run -->
      <div class="pedal-cluster">
        <button id="btn-brake" class="control-btn pedal-btn brake-btn" type="button" aria-label="Brake or walk backward">BRAKE</button>
        <button id="btn-gas" class="control-btn pedal-btn gas-btn" type="button" aria-label="Accelerate or walk forward">GAS</button>
      </div>
    </div>

    <div id="loading-overlay">
      <div class="spinner"></div>
      <p id="loading-text">Loading Circuit & Environment...</p>
    </div>
  </div>

  <script src="libs/three.min.js"></script>
  <script src="libs/GLTFLoader.js"></script>
  <script src="game.js"></script>
</body>
</html>
