<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0d2137" />
  <title>Island Adventure</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- In-game HUD -->
    <header id="hud">
      <div class="hud-pill">
        <span class="hud-title">🏝️ Island Adventure</span>
        <span id="fps-counter" class="hud-sub">3D Explorer</span>
      </div>
    </header>

    <!-- Mobile Dual Touch Layer -->
    <div id="touch-layer">
      <!-- Left side: dynamic floating joystick zone -->
      <div id="left-zone">
        <div id="joystick-base" class="hidden">
          <div id="joystick-knob"></div>
        </div>
      </div>

      <!-- Right side: camera look zone and action buttons -->
      <div id="right-zone">
        <div id="actions">
          <button id="btn-sprint" class="action-btn" type="button" aria-label="Sprint">
            <span>RUN</span>
          </button>
          <button id="btn-jump" class="action-btn" type="button" aria-label="Jump">
            <span>JUMP</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./libs/three.module.js",
        "three/addons/": "./libs/"
      }
    }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
